<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Предзаказы — pilot_arbuza</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geologica:wght@400;500;600&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body { min-height: 100svh; }
    [hidden] { display: none !important; }
    .ad { max-width: 1100px; margin: 0 auto; padding: 24px var(--gutter) 64px; display: flex; flex-direction: column; gap: 24px; }
    .ad__top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ad__top h1 { font-size: clamp(30px, 5vw, 44px); }
    .ad__acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .ad__login { max-width: 420px; margin: 12vh auto 0; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
    .ad__login h1 { font-size: 30px; }
    .ad__msg { color: var(--wine); font-size: 15px; min-height: 1.4em; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
    .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chips b { font-weight: 600; opacity: .6; margin-left: 4px; }
    .ad__tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .ad__tools input { flex: 1 1 220px; max-width: 360px; }
    .ord { padding: 20px; display: grid; grid-template-columns: 96px minmax(0, 1fr) 220px; gap: 20px; border-radius: 20px; border-left: 6px solid var(--st, var(--muted-d)); }
    .ord img { width: 96px; height: auto; border-radius: 12px; background: #F6F2EA; }
    .ord__main { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
    .ord__id { font-size: 14px; color: var(--muted); }
    .ord__what { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .ord__meta { font-size: 15px; color: var(--ink-2); }
    .ord__meta a { text-decoration: underline; text-underline-offset: 3px; }
    .ord__comment { font-size: 15px; color: var(--muted); white-space: pre-wrap; }
    .ord__side { display: flex; flex-direction: column; gap: 8px; }
    .ord__side textarea { min-height: 64px; }
    .ord__del { align-self: flex-start; border: 0; background: none; color: var(--wine); font: 500 14px var(--f-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }
    .dm { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .dm__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .dm__head h2 { font-size: 22px; letter-spacing: -0.01em; } .dm__head span { font-size: 14px; color: var(--muted); }
    .dm__scroll { overflow-x: auto; }
    .dm table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .dm th, .dm td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .dm th:first-child, .dm td:first-child { text-align: left; }
    .dm thead th { font-weight: 500; color: var(--muted); }
    .dm td.hot { background: rgba(255,92,115,calc(var(--k) * .55)); font-weight: 600; }
    .dm td.zero { color: var(--muted-d); }
    .dm tfoot td, .dm td:last-child, .dm th:last-child { font-weight: 600; }
    .dm__sizes { display: flex; gap: 8px; flex-wrap: wrap; }
    .dm__sizes span { padding: 6px 12px; border-radius: 999px; background: var(--paper-2); font-size: 14px; } .dm__sizes b { margin-left: 6px; }
    .ad__empty { padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 760px) { .ord { grid-template-columns: 64px minmax(0, 1fr); } .ord img { width: 64px; } .ord__side { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main class="ad">
    <form class="ad__login card" id="login" hidden>
      <span class="hand" style="font-size:22px">pilot_arbuza</span>
      <h1>Предзаказы</h1>
      <label class="fld"><span>Пароль</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--primary" type="submit">Войти</button>
      <p class="ad__msg" id="login-msg" role="alert"></p>
    </form>

    <div id="panel" hidden>
      <div class="ad" style="padding:0">
        <div class="ad__top">
          <h1>Предзаказы <span class="doto accent" id="total"></span></h1>
          <div class="ad__acts">
            <a class="btn btn--ghost btn--sm" href="/api/admin/orders.csv">Скачать CSV</a>
            <a class="btn btn--ghost btn--sm" href="/shop/">Магазин</a>
            <button class="btn btn--primary btn--sm" type="button" id="logout">Выйти</button>
          </div>
        </div>
        <section class="dm card" id="demand" hidden></section>
        <div class="ad__tools">
          <div class="chips" id="chips" role="group" aria-label="Статус"></div>
          <input class="fld-in" id="search" type="search" placeholder="Поиск: имя, контакт, город, №" aria-label="Поиск">
        </div>
        <p class="ad__msg" id="msg" role="status"></p>
        <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </div>
  </main>
  <script src="/assets/admin.js" defer></script>
</body>
</html>
